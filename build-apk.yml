# Save as: .github/workflows/build-apk.yml
# Repo root must contain: index.html, sw.js, manifest.json, icons/ (icon-512.png, maskable-512.png)
name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare web files and Capacitor config
        run: |
          mkdir -p www
          cp index.html sw.js manifest.json www/
          cp -r icons www/icons
          # Treat the Capacitor app as "installed" so the PWA install banner stays hidden
          sed -i 's/const isStandalone = () => window.matchMedia/const isStandalone = () => !!window.Capacitor || window.matchMedia/' www/index.html
          cat > package.json <<'JSON'
          {
            "name": "gradeflow-app",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/android": "^6.2.0",
              "@capacitor/cli": "^6.2.0",
              "@capacitor/core": "^6.2.0"
            }
          }
          JSON
          cat > capacitor.config.json <<'JSON'
          {
            "appId": "com.gradeflow.app",
            "appName": "GradeFlow",
            "webDir": "www",
            "backgroundColor": "#0f172a",
            "server": { "androidScheme": "https" }
          }
          JSON

      - name: Install Capacitor and create Android project
        run: |
          npm install
          npx cap add android

      - name: Generate launcher icons from icons/
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick
          RES=android/app/src/main/res
          IM=$(command -v magick || command -v convert)
          for d in mdpi:48:108 hdpi:72:162 xhdpi:96:216 xxhdpi:144:324 xxxhdpi:192:432; do
            IFS=: read name legacy adaptive <<< "$d"
            mkdir -p $RES/mipmap-$name
            $IM icons/icon-512.png -resize ${legacy}x${legacy} $RES/mipmap-$name/ic_launcher.png
            $IM icons/icon-512.png -resize ${legacy}x${legacy} $RES/mipmap-$name/ic_launcher_round.png
            $IM icons/maskable-512.png -resize ${adaptive}x${adaptive} $RES/mipmap-$name/ic_launcher_foreground.png
          done
          printf '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <color name="ic_launcher_background">#2563EB</color>\n</resources>\n' > $RES/values/ic_launcher_background.xml

      - name: Sync web files into Android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: GradeFlow-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
